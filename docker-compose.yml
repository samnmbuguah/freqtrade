---
services:
  freqtrade_254m:
    image: freqtradeorg/freqtrade:develop
    restart: unless-stopped
    container_name: freqtrade_254m
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - "./user_data:/freqtrade/user_data"
      - "./freqtrade:/freqtrade/freqtrade"
    ports:
      - "8080:8080"
    command: >
      trade --logfile /freqtrade/user_data/logs/freqtrade_254m.log --db-url sqlite:////freqtrade/user_data/tradesv3_254m.sqlite --config /freqtrade/user_data/config_254m.json --strategy LiquidityGoblin254m
    networks:
      screencoins_default:
    extra_hosts:
      - "web:172.18.0.1"

  freqtrade_fvg:
    image: freqtradeorg/freqtrade:develop
    restart: unless-stopped
    container_name: freqtrade_fvg
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - "./user_data:/freqtrade/user_data"
      - "./freqtrade:/freqtrade/freqtrade"
    ports:
      - "8081:8081"
    command: >
      trade --logfile /freqtrade/user_data/logs/freqtrade_fvg.log --db-url sqlite:////freqtrade/user_data/tradesv3_fvg.sqlite --config /freqtrade/user_data/config_fvg.json --strategy FvgLiquidity
    networks:
      screencoins_default:
        aliases:
          - web

  freqtrade_nfi:
    image: freqtradeorg/freqtrade:develop
    restart: unless-stopped
    container_name: freqtrade_nfi
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - "./user_data:/freqtrade/user_data"
      - "./freqtrade:/freqtrade/freqtrade"
    ports:
      - "8082:8082"
    command: >
      trade --logfile /freqtrade/user_data/logs/freqtrade_nfi.log --db-url sqlite:////freqtrade/user_data/tradesv3_nfi.sqlite --config /freqtrade/user_data/config_nfi.json --strategy NostalgiaForInfinityX7
    networks:
      - screencoins_default

networks:
  screencoins_default:
    external: true
